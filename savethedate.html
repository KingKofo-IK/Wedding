<style>
  :root {
    --sage-deep: #34473A; --sage-darker: #26352B; --cream: #F8F5EF; --gold: #B08D57; --gold-light: #E2CB98;
    --script: "Pinyon Script", "Snell Roundhand", cursive; --serif: "Fraunces", Georgia, serif;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  html { background: var(--sage-darker); }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100svh; font-family: var(--serif); color: var(--cream);
    background: radial-gradient(ellipse 110% 70% at 50% 38%, #46604B 0%, var(--sage-deep) 48%, var(--sage-darker) 100%) no-repeat;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  body.locked { overflow: hidden; }

  /* ---------- Sealed envelope ---------- */
  .scene { position: fixed; inset: 0; display: grid; place-items: center; padding: 1.5rem; z-index: 2; }
  .scene-inner { display: grid; justify-items: center; text-align: center; width: 100%; }
  .from { margin: 0; font-size: .82rem; letter-spacing: .3em; color: var(--gold-light); }
  .names { margin: .3rem 0 1.8rem; font-family: var(--script); font-weight: 400; font-size: clamp(2.8rem, 13vw, 4.2rem); line-height: 1.2; color: #EAD6A6; white-space: nowrap; }
  .envelope {
    position: relative; width: min(86vw, 420px); aspect-ratio: 1.45; border: 0; padding: 0; background: none; cursor: pointer;
    perspective: 1000px; font: inherit; color: inherit; animation: float 4.5s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-6px) rotate(-.6deg); } }
  .envelope:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 10px; border-radius: 6px; }
  .back, .pocket, .flap { position: absolute; }
  .back { inset: 0; border-radius: 5px; background: #E7DECD; box-shadow: 0 30px 50px -20px rgba(0,0,0,.6); z-index: 1; }
  .liner { position: absolute; inset: 0; border-radius: 5px; background: #AECBDD; clip-path: polygon(4% 3%, 96% 3%, 50% 56%); opacity: .9; }
  .card-box { position: absolute; display: block; z-index: 2; overflow: hidden; border-radius: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  .card-box .sd { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .pocket { inset: 0; z-index: 3; border-radius: 0 0 5px 5px; background: linear-gradient(180deg, #F3EDE1, #EAE1D0); clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%); }
  .pocket::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, #F6F1E7, #EFE7DA); clip-path: polygon(0 100%, 50% 47%, 100% 100%); }
  .pocket::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(176,141,87,.0), rgba(176,141,87,.0)); }
  .flap {
    left: 0; right: 0; top: 0; height: 58%; z-index: 4; transform-origin: 50% 0;
    background: linear-gradient(180deg, #EDE5D6, #E3D9C6); clip-path: polygon(0 0, 100% 0, 50% 100%);
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.14));
  }
  .seal {
    position: absolute; z-index: 5; left: 50%; top: 58%; width: 19%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 36% 30%, #6A886C 0%, var(--sage-deep) 55%, #1F2C22 100%);
    box-shadow: 0 3px 6px rgba(0,0,0,.35), inset 0 0 0 3px rgba(0,0,0,.12), inset 0 0 0 5px rgba(226,203,152,.25);
    animation: breathe 2.4s ease-in-out 1s infinite;
  }
  @keyframes breathe { 50% { transform: translate(-50%, -50%) scale(1.06); } }
  .seal span { font-family: var(--script); font-size: clamp(1.1rem, 5vw, 1.6rem); color: var(--gold-light); padding-top: .15em; }
  .hint { margin: 1.8rem 0 0; font-style: italic; font-weight: 300; font-size: 1rem; color: #C9D3C5; }

  /* ---------- Revealed card ---------- */
  .final { width: 100%; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.25rem 2.5rem; }
  .slot { position: relative; }
  .slot .card-box { position: relative; box-shadow: 0 34px 60px -24px rgba(0,0,0,.7); border-radius: 4px; }
  .after { margin-top: 1.6rem; display: grid; justify-items: center; gap: .8rem; opacity: 0; transition: opacity .8s ease .2s; }
  .after.on { opacity: 1; }
  .after p { margin: 0; font-style: italic; font-weight: 300; font-size: 1rem; color: #DCE3D8; }
  .cal { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem; }
  .cal a, .cal button {
    min-height: 44px; display: inline-flex; align-items: center; padding: .6rem 1.1rem; border-radius: 999px;
    border: 1px solid rgba(226,203,152,.6); background: transparent; color: var(--gold-light);
    font: 400 .92rem var(--serif); text-decoration: none; cursor: pointer; transition: background .2s, color .2s;
  }
  .cal a:hover, .cal button:hover { background: var(--gold-light); color: var(--sage-darker); }
  .cal a:focus-visible, .cal button:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 3px; }

  /* The save the date card itself, designed at 480 x 672 */
  .sd { width: 480px; height: 672px; position: relative; overflow: hidden; background: #F8F5EF; font-family: var(--serif); color: #26302A; text-align: center; }
  .sd p { margin: 0; }
  .sd .f1 { position: absolute; inset: 16px; border: 1px solid #B08D57; }
  .sd .f2 { position: absolute; inset: 21px; border: 1px solid #D9C7A4; }
  .sd .arch { position: absolute; left: 125px; top: 50px; width: 230px; height: 314px; }
  .sd .arch .win { position: absolute; inset: 0; overflow: hidden; border-radius: 115px 115px 6px 6px; background: #D6E5EE; }
  .sd .arch .win img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
  .sd .arch .line { position: absolute; top: 8px; right: 8px; bottom: 0; left: 8px; border: 1px solid #E9D39E; border-bottom: 0; border-radius: 107px 107px 4px 4px; }
  .sd .arch .roses { position: absolute; left: -23px; top: -23px; width: 276px; height: 360px; }
  .sd .std { position: absolute; left: 0; right: 0; top: 374px; font-family: var(--script); font-size: 50px; line-height: 1.1; color: #8C6D3F; }
  .sd .who { position: absolute; left: 0; right: 0; top: 436px; font-weight: 300; font-size: 19px; letter-spacing: .22em; color: #34473A; }
  .sd .dates { position: absolute; left: 52px; right: 52px; top: 478px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; }
  .sd .dates > div { display: flex; flex-direction: column; gap: 3px; }
  .sd .dates > div + div { border-left: 1px solid #D9C7A4; }
  .sd .lab { font-style: italic; font-size: 13px; color: #7A5E34; }
  .sd .day { font-size: 18px; }
  .sd .city { font-size: 13px; color: #3E4A42; }
  .sd .foot { position: absolute; left: 60px; right: 60px; top: 582px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .sd .foot p { margin-top: 4px; font-style: italic; font-size: 13px; color: #3E4A42; }

  @media (prefers-reduced-motion: reduce) { .envelope, .seal { animation: none; } }
</style>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const env = $("envelope"), box = $("cardBox");
  const card = $("cardTpl").content.firstElementChild.cloneNode(true);
  box.appendChild(card);

  // Card size while tucked inside the envelope
  function layoutInside() {
    const r = env.getBoundingClientRect();
    const h = r.height * 0.86, w = h * 480 / 672;
    Object.assign(box.style, { width: w + "px", height: h + "px", left: (r.width - w) / 2 + "px", top: r.height * 0.07 + "px" });
    card.style.transform = "scale(" + (w / 480) + ")";
  }
  // Card size once revealed
  function finalSize() {
    const vw = Math.min(innerWidth - 40, 470), vh = innerHeight - 190;
    const w = Math.max(240, Math.min(vw, vh * 480 / 672));
    return { w, h: w * 672 / 480 };
  }
  layoutInside();
  addEventListener("resize", () => {
    if (!opened) layoutInside();
    else { const { w, h } = finalSize(); box.style.width = w + "px"; box.style.height = h + "px"; card.style.transform = "scale(" + (w / 480) + ")"; }
  });

  let opened = false, busy = false;
  async function open() {
    if (busy || opened) return; busy = true;
    env.style.animation = "none"; $("seal").style.animation = "none";
    $("hint").animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: "forwards" });
    const ease = "cubic-bezier(.45,.05,.2,1)";
    if (!reduce) {
      await $("seal").animate([{ transform: "translate(-50%,-50%) scale(1)", opacity: 1 }, { transform: "translate(-50%,-50%) scale(1.18)", opacity: 1, offset: .35 }, { transform: "translate(-50%,-50%) scale(.4)", opacity: 0 }], { duration: 520, fill: "forwards" }).finished;
      await $("flap").animate([{ transform: "rotateX(0deg)" }, { transform: "rotateX(178deg)" }], { duration: 800, easing: ease, fill: "forwards" }).finished;
    }
    $("flap").style.zIndex = 0;
    // The card slides up out of the envelope
    const rise = box.getBoundingClientRect().height * 0.78;
    if (!reduce) await box.animate([{ transform: "translateY(0)" }, { transform: `translateY(${-rise}px)` }], { duration: 950, easing: "cubic-bezier(.2,.7,.2,1)", fill: "forwards" }).finished;
    const from = box.getBoundingClientRect();

    // Hand the card to the final layout and animate it from where it was
    box.getAnimations().forEach(a => a.cancel());
    const { w, h } = finalSize();
    Object.assign(box.style, { left: "", top: "", width: w + "px", height: h + "px" });
    card.style.transform = "scale(" + (w / 480) + ")";
    $("final").hidden = false; $("slot").appendChild(box); opened = true;
    const to = box.getBoundingClientRect();
    const s = from.width / to.width;
    const dx = from.left - to.left, dy = from.top - to.top;
    $("scene").animate([{ opacity: 1 }, { opacity: 0 }], { duration: reduce ? 1 : 700, fill: "forwards" }).finished.then(() => $("scene").remove());
    if (!reduce) await box.animate([
      { transform: `translate(${dx}px, ${dy}px) scale(${s})`, transformOrigin: "0 0" },
      { transform: `translate(${dx * .15}px, ${dy * .15 - 14}px) scale(${1 + (s - 1) * .1})`, transformOrigin: "0 0", offset: .82 },
      { transform: "translate(0,0) scale(1)", transformOrigin: "0 0" }
    ], { duration: 1300, easing: "cubic-bezier(.3,.7,.2,1)" }).finished;
    document.body.classList.remove("locked");
    $("after").classList.add("on");
    busy = false;
  }
  env.addEventListener("click", open);

  // Calendar links (all-day entries)
  const events = [
    { id: "lagos", title: "Funbi & Iyanu: Traditional Wedding", day: "20280401", next: "20280402", where: "Lagos, Nigeria" },
    { id: "atlanta", title: "Funbi & Iyanu: White Wedding", day: "20280429", next: "20280430", where: "Atlanta, Georgia" }
  ];
  const g = e => "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(e.title) +
    "&dates=" + e.day + "/" + e.next + "&details=" + encodeURIComponent("Save the date. Formal invitation to follow.") + "&location=" + encodeURIComponent(e.where);
  $("gLagos").href = g(events[0]); $("gAtl").href = g(events[1]);
  $("ics").addEventListener("click", () => {
    const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
    const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Funbi and Iyanu//Save the Date//EN"];
    events.forEach(e => lines.push("BEGIN:VEVENT", "UID:" + e.id + "-savethedate-funbi-iyanu", "DTSTAMP:" + stamp,
      "DTSTART;VALUE=DATE:" + e.day, "DTEND;VALUE=DATE:" + e.next, "SUMMARY:" + e.title.replace(/,/g, "\\,"),
      "DESCRIPTION:Save the date. Formal invitation to follow.", "LOCATION:" + e.where.replace(/,/g, "\\,"), "END:VEVENT"));
    lines.push("END:VCALENDAR");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lines.join("\r\n")], { type: "text/calendar" }));
    a.download = "Funbi-and-Iyanu-Save-the-Date.ics"; document.body.appendChild(a); a.click(); a.remove();
  });
})();
</script>
