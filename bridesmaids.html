<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F&amp;I Airways: Online Check-in</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="F&amp;I Airways: Online Check-in">
<meta property="og:description" content="You have a boarding pass waiting. Check in to see it.">
<meta property="og:image" content="https://thekofoworades.com/og-image.png">
<meta property="og:url" content="https://thekofoworades.com/bridesmaids">
<meta name="theme-color" content="#34473A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
  :root {
    --sage: #5C7A5E; --sage-deep: #34473A; --sage-darker: #26352B; --cream: #F8F5EF;
    --gold: #B08D57; --gold-light: #E2CB98; --gold-deep: #7A5E34; --ink: #26302A;
    --script: "Pinyon Script", "Snell Roundhand", cursive;
    --serif: "Fraunces", Georgia, serif;
    --mono: "IBM Plex Mono", "Courier New", monospace;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  html { background: var(--sage-darker); }
  body {
    background: radial-gradient(ellipse 120% 60% at 50% 0%, #46604B 0%, var(--sage-deep) 50%, var(--sage-darker) 100%) no-repeat;
    color: var(--cream); font-family: var(--mono);
    display: flex; justify-content: center;
  }
  main { width: min(100%, 520px); padding: 2.5rem 1.25rem 3rem; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .brand { display: flex; align-items: center; gap: .6rem; }
  .brand svg { width: 30px; height: 30px; }
  .brand span { font-family: var(--script); font-size: 2.6rem; line-height: 1; color: var(--gold-light); padding-top: .3rem; }
  .kicker { margin: .9rem 0 0; font-size: .82rem; font-weight: 500; letter-spacing: .3em; color: var(--gold-light); }

  /* Check-in */
  .checkin { width: 100%; margin-top: 2rem; background: var(--cream); color: var(--ink); border-radius: 22px; padding: 1.8rem 1.4rem 1.6rem; text-align: left; box-shadow: 0 30px 60px -25px rgba(0,0,0,.6); }
  .checkin h1 { margin: 0 0 .4rem; font-family: var(--serif); font-weight: 400; font-size: 1.7rem; line-height: 1.2; color: var(--sage-deep); }
  .checkin p { margin: 0 0 1.4rem; font-size: .88rem; line-height: 1.6; color: #4A564E; }
  label { display: block; font-size: .72rem; font-weight: 500; letter-spacing: .2em; color: var(--sage); margin-bottom: .5rem; }
  .combo { position: relative; }
  .combo input {
    width: 100%; font: 400 1.15rem var(--serif); color: var(--ink);
    background: #fff; border: 1.5px solid #CFC7B6; border-radius: 12px; padding: .9rem 1rem;
    transition: border-color .2s, box-shadow .2s;
  }
  .combo input:focus { outline: none; border-color: var(--sage); box-shadow: 0 0 0 4px rgba(92,122,94,.15); }
  .combo input[aria-invalid="true"] { border-color: #A4532F; }
  .listbox {
    position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 6px); margin: 0; padding: .35rem; list-style: none;
    background: #fff; border: 1px solid #DDD5C4; border-radius: 12px; box-shadow: 0 18px 30px -12px rgba(38,48,42,.35);
    max-height: 260px; overflow: auto;
  }
  .listbox li { padding: .8rem .85rem; border-radius: 8px; cursor: pointer; font: 400 1.05rem var(--serif); display: flex; justify-content: space-between; align-items: center; gap: 1rem; min-height: 44px; }
  .listbox li small { font: 500 .66rem var(--mono); letter-spacing: .14em; color: var(--gold-deep); white-space: nowrap; }
  .listbox li[aria-selected="true"], .listbox li:hover { background: #EEF2EC; }
  .listbox .empty { cursor: default; font: .85rem/1.5 var(--mono); color: #6B5A45; }
  .listbox .empty:hover { background: none; }
  .msg { min-height: 1.3em; margin: .6rem 0 0 !important; font-size: .8rem !important; color: #8A4A2C !important; }
  .btn {
    width: 100%; margin-top: 1rem; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--sage-deep); color: var(--cream); font: 500 .9rem var(--mono); letter-spacing: .2em;
    padding: 1.05rem 1.2rem; transition: background .2s, opacity .2s, transform .2s;
  }
  .btn:hover:not(:disabled) { background: #2B3B30; }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:focus-visible, .ghost:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* Printing */
  .printing { margin-top: 3rem; display: grid; justify-items: center; gap: 1.2rem; }
  .slot { width: 220px; height: 10px; border-radius: 6px; background: #1B261E; box-shadow: inset 0 2px 4px rgba(0,0,0,.6); }
  .paper { width: 190px; height: 0; background: var(--cream); border-radius: 0 0 6px 6px; margin-top: -1.2rem; animation: feed 1.5s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes feed { to { height: 110px; } }
  .printing p { margin: 0; font-size: .82rem; letter-spacing: .24em; color: var(--gold-light); }

  /* Result */
  .result { width: 100%; margin-top: 1.6rem; display: flex; flex-direction: column; align-items: center; }
  .result .hello { margin: 0 0 1.1rem; font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 1.3rem; }
  .viewport { position: relative; width: 100%; aspect-ratio: 1080 / 1350; border-radius: 10px; overflow: hidden; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); }
  .viewport .poster { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .result .arrive, .book.arrive { animation: arrive 1s cubic-bezier(.2,.8,.25,1); }
  @keyframes arrive { from { opacity: 0; transform: translateY(40px) rotate(-2deg); } }
  .actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; margin-top: 1.3rem; }
  .actions .btn { margin: 0; background: var(--gold); color: var(--sage-darker); font-size: .78rem; letter-spacing: .14em; }
  .actions .btn:hover:not(:disabled) { background: #C19E66; }
  .ghost { margin-top: 1.1rem; background: none; border: 0; color: #C9D3C5; font: .8rem var(--mono); letter-spacing: .12em; text-decoration: underline; cursor: pointer; padding: .6rem; }
  .fine { margin: 1.4rem 0 0; font-size: .74rem; line-height: 1.6; color: #A9B6A6; }

  /* ---------- The pass itself (1080 x 1350, captured for download) ---------- */
  .poster { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #34473A; font-family: var(--mono); color: var(--ink); text-align: left; }
  .poster .f1 { position: absolute; inset: 30px; border: 1px solid #B08D57; }
  .poster .f2 { position: absolute; inset: 38px; border: 1px solid #6E6A4E; }
  .pass { position: absolute; left: 110px; top: 85px; width: 860px; height: 1180px; border-radius: 28px; background: #F8F5EF; overflow: hidden; }
  .band { position: absolute; left: 0; top: 0; width: 860px; height: 150px; background: #2B3B30; padding: 0 56px; display: flex; align-items: center; justify-content: space-between; }
  .band .air { display: flex; align-items: center; gap: 18px; }
  .band .air span { font-family: var(--script); font-size: 62px; line-height: 1; color: #E2CB98; padding-top: 8px; }
  .band .bp { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .band .bp b { font-weight: 500; font-size: 26px; letter-spacing: .26em; color: #F8F5EF; }
  .band .bp i { font-style: normal; font-size: 22px; letter-spacing: .24em; color: #D9C091; }
  .lbl { display: block; font-size: 22px; letter-spacing: .17em; color: #4F6A52; }
  .row1 { position: absolute; left: 56px; right: 56px; top: 186px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
  .pname { display: block; margin-top: 6px; font-family: var(--serif); font-size: 46px; line-height: 1.1; white-space: nowrap; }
  .flight { text-align: right; flex-shrink: 0; }
  .flight b { display: block; margin-top: 6px; font-size: 36px; font-weight: 500; }
  .route { position: absolute; left: 56px; right: 56px; top: 316px; display: flex; align-items: center; justify-content: space-between; }
  .route .code { display: flex; flex-direction: column; }
  .route .code.r { align-items: flex-end; }
  .route .code b { font-family: var(--serif); font-weight: 300; font-size: 124px; line-height: 1; color: #34473A; }
  .route .code i { font-style: normal; font-size: 24px; color: #3E4A42; margin-top: 10px; white-space: nowrap; }
  .ask { position: absolute; left: 30px; right: 30px; top: 500px; margin: 0; text-align: center; font-family: var(--script); font-size: 66px; line-height: 1.2; white-space: nowrap; color: #7A5E34; }
  .grid { position: absolute; left: 56px; right: 56px; top: 632px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; row-gap: 30px; border-top: 1.5px solid #D9C7A4; padding-top: 32px; }
  .grid b { display: block; margin-top: 6px; font-size: 30px; font-weight: 500; white-space: nowrap; }
  .roses { position: absolute; left: 690px; top: 772px; width: 190px; height: 148px; }
  .perf { position: absolute; left: 48px; right: 48px; top: 900px; border-top: 3px dashed #9FB29F; }
  .notch { position: absolute; top: 872px; width: 60px; height: 60px; border-radius: 50%; background: #34473A; }
  .stub { position: absolute; left: 56px; right: 56px; top: 934px; display: flex; justify-content: space-between; align-items: center; }
  .stub .love { font-family: var(--script); font-size: 64px; line-height: 1.1; color: #7A5E34; }
  .stub .reply { font-size: 24px; letter-spacing: .12em; color: #3E4A42; }
  .barcode { position: absolute; left: 56px; top: 1040px; width: 748px; height: 96px; }
  .barcode i { position: absolute; top: 0; bottom: 0; background: #26302A; }
  .foot { position: absolute; left: 0; right: 0; top: 1144px; text-align: center; font-size: 20px; letter-spacing: .3em; color: #3E4A42; }

  /* Maid of honour: first class in gold */
  .poster.moh { background: #2B3B30; }
  .poster.moh .notch { background: #2B3B30; }
  .poster.moh .band { background: #A07E4B; }
  .poster.moh .band .air span { color: #FBF3DF; }
  .poster.moh .band .bp i { color: #2B3B30; font-weight: 500; }
  .poster.moh .band svg path { stroke: #FBF3DF; }
  .poster.moh .pass { box-shadow: 0 0 0 6px #B08D57; }
  .ribbon { position: absolute; right: -58px; top: 172px; width: 260px; transform: rotate(38deg); background: #B08D57; color: #FBF3DF; text-align: center; font-size: 18px; font-weight: 500; letter-spacing: .3em; padding: 10px 0; }
  .poster:not(.moh) .ribbon { display: none; }
  .poster.moh .row1 { right: 150px; }

  /* ---------- Passport ---------- */
  .passport-block { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .book { position: relative; width: min(100%, 300px); aspect-ratio: 88 / 125; perspective: 1600px; margin: .2rem 0 .9rem; }
  .book .page-wrap { position: absolute; inset: 0; border-radius: 3px 10px 10px 3px; overflow: hidden; background: #F7F2E7; box-shadow: 0 26px 50px -20px rgba(0,0,0,.65); }
  .book .page-wrap .dp { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .cover {
    position: absolute; inset: 0; z-index: 2; padding: 0; border: 0; cursor: pointer; background: #121212;
    border-radius: 3px 10px 10px 3px; transform-origin: left center; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 26px 50px -20px rgba(0,0,0,.7), inset 6px 0 10px -6px rgba(255,255,255,.08);
    animation: bob 4s ease-in-out infinite;
  }
  .cover:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 5px; }
  .cover .cover-art { position: absolute; inset: 0; width: 100%; height: 100%; }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(-.6deg); } }
  .tap { margin: 0; font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 1.05rem; color: #C9D3C5; }
  .pass-area { width: 100%; display: flex; flex-direction: column; align-items: center; margin-top: 1.6rem; }
  .pass-area .label { margin: 0 0 .8rem; font-size: .76rem; letter-spacing: .28em; color: var(--gold-light); }

  /* Data page, designed at 352 x 500 (4 px per mm) */
  .dp { width: 352px; height: 500px; position: relative; background: #F7F2E7; color: #26302A; font-family: var(--mono); text-align: left; overflow: hidden; }
  .dp .guil { position: absolute; inset: 0; width: 100%; height: 100%; }
  .dp .hdr { position: absolute; left: 24px; right: 24px; top: 24px; display: flex; justify-content: space-between; font-size: 9.5px; font-weight: 500; letter-spacing: 2px; color: #5C7A5E; border-bottom: 1px solid #CDBF9F; padding-bottom: 6px; }
  .dp .photo { position: absolute; left: 24px; top: 62px; width: 100px; height: 126px; border: 1.5px solid #CDBF9F; border-radius: 6px; background: #F1EBDD; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .dp .photo b { font-family: var(--script); font-weight: 400; font-size: 46px; line-height: 1; color: #B8934F; padding-top: 6px; }
  .dp .photo i { font-style: normal; font-family: var(--serif); font-size: 8.5px; letter-spacing: 1.6px; color: #7A5E34; }
  .dp .data { position: absolute; left: 140px; right: 20px; top: 58px; }
  .dp .trio { display: grid; grid-template-columns: .55fr .7fr 1.35fr; gap: 6px; margin-bottom: 8px; }
  .dp .k { display: block; font-size: 7.5px; letter-spacing: .8px; color: #5C7A5E; text-transform: uppercase; }
  .dp .v { display: block; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .dp .v.big { font-family: var(--serif); font-weight: 400; font-size: 16px; letter-spacing: .6px; text-transform: uppercase; line-height: 1.25; }
  .dp .f { margin-bottom: 5px; }
  .dp .sig { position: absolute; left: 24px; top: 204px; width: 100px; }
  .dp .sig .s { display: block; font-family: var(--script); font-size: 28px; line-height: 1.15; color: #34473A; border-bottom: 1px solid #999; }
  .dp .stamp { position: absolute; left: 196px; top: 300px; width: 120px; height: 120px; transform: rotate(-14deg); opacity: 0; }
  .dp .stamp.on { opacity: .92; }
  .dp .welcome { position: absolute; left: 24px; top: 318px; width: 160px; margin: 0; font-family: var(--serif); font-style: italic; font-size: 15px; line-height: 1.45; color: #34473A; }
  .dp .welcome b { display: block; font-family: var(--script); font-style: normal; font-weight: 400; font-size: 26px; color: #7A5E34; margin-top: 4px; }
  .dp .mrz { position: absolute; left: 16px; right: 12px; bottom: 18px; font-size: 11.6px; line-height: 1.5; white-space: pre; color: #26302A; }
  @media (prefers-reduced-motion: reduce) { .cover { animation: none; } }

  .capture-host { position: fixed; left: -20000px; top: 0; }
  @media (prefers-reduced-motion: reduce) { .paper { animation: none; height: 110px; } .result .arrive { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 13.5 L22 8 L20.5 5.5 L13 8 L7 3 L5 3.6 L9 9.5 L4.5 11 L2.5 9.5 L1 10 Z M5 16 H19" fill="none" stroke="#E2CB98" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span>F&amp;I Airways</span>
  </div>
  <p class="kicker">ONLINE CHECK-IN</p>

  <section class="checkin" id="checkin" aria-labelledby="ciTitle">
    <h1 id="ciTitle">You have a boarding pass waiting</h1>
    <p>Start typing your name, then choose it from the list to check in.</p>
    <label for="nameInput" id="nameLabel">PASSENGER NAME</label>
    <div class="combo">
      <input id="nameInput" type="text" autocomplete="off" autocapitalize="words" spellcheck="false"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="nameList" aria-describedby="nameMsg" placeholder="Your name">
      <ul class="listbox" id="nameList" role="listbox" aria-labelledby="nameLabel" hidden></ul>
    </div>
    <p class="msg" id="nameMsg" aria-live="polite"></p>
    <button class="btn" id="proceed" type="button" disabled>PROCEED TO BOARDING</button>
  </section>

  <section class="printing" id="printing" hidden aria-live="polite">
    <div class="slot"></div><div class="paper"></div>
    <p>ISSUING YOUR PASSPORT</p>
  </section>

  <section class="result" id="result" hidden>
    <p class="hello" id="hello"></p>
    <div class="passport-block">
      <div class="book" id="book">

<script>
/* ============================================================
   PASSENGER LIST. Add each name exactly as it should print.
   role: "maid-of-honour" or "bridesmaid"
   ============================================================ */
const PASSENGERS = [
  { name: "Faith Nwake", role: "maid-of-honour" },
  { name: "Favour Aibangbee", role: "bridesmaid" },
  { name: "Given Brown", role: "bridesmaid" },
  { name: "Sarah Brown", role: "bridesmaid" },
  { name: "Anna Addison", role: "bridesmaid" },
  { name: "Dami Adekanle", role: "bridesmaid" },
  { name: "Tomi Olabosinde", role: "bridesmaid" },
  { name: "Deborah Osime", role: "bridesmaid" },
  { name: "Adeola Ogunderu", role: "bridesmaid" },
  { name: "Teni Olasanya", role: "bridesmaid" },
  { name: "Enedu David-Maji", role: "bridesmaid" },
  { name: "Fisayo Ojo", role: "bridesmaid" },
  { name: "Fola Ojo", role: "bridesmaid" }
];
const REPLY_BY = "[DATE]";   // e.g. "MAY 1, 2027"

/* How each pass reads */
const ROLES = {
  "bridesmaid": {
    cls: "BRIDAL CLASS", flight: "FI 2028", to: "BRD", toName: "Bridesmaid",
    ask: "Will you be my bridesmaid?", seat: "By my side", boarding: "Now", label: "Bridesmaid"
  },
  "maid-of-honour": {
    cls: "FIRST CLASS", flight: "FI 0001", to: "MOH", toName: "Maid of Honour",
    ask: "Will you be my maid of honour?", seat: "Right beside me", boarding: "First", label: "Maid of Honour"
  }
};

(function () {
  const $ = id => document.getElementById(id);
  const input = $("nameInput"), list = $("nameList"), msg = $("nameMsg"), proceed = $("proceed");
  const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  let chosen = null, options = [], active = -1, currentPoster = null;

  function render(matches, q) {
    list.innerHTML = ""; options = matches; active = -1;
    if (!q) { close(); return; }
    if (!matches.length) {
      const li = document.createElement("li"); li.className = "empty"; li.setAttribute("role", "option"); li.setAttribute("aria-disabled", "true");
      li.textContent = "No passenger found by that name. Check the spelling, or reach out to Funbi.";
      list.appendChild(li);
    }
    matches.forEach((p, i) => {
      const li = document.createElement("li");
      li.id = "opt" + i; li.setAttribute("role", "option"); li.setAttribute("aria-selected", "false");
      li.textContent = p.name;
      const tag = document.createElement("small"); tag.textContent = ROLES[p.role].label.toUpperCase(); li.appendChild(tag);
      li.addEventListener("mousedown", e => { e.preventDefault(); pick(p); });
      list.appendChild(li);
    });
    list.hidden = false; input.setAttribute("aria-expanded", "true");
  }
  function close() { list.hidden = true; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-activedescendant"); }
  function setActive(i) {
    [...list.querySelectorAll('[role="option"]:not(.empty)')].forEach((li, j) => li.setAttribute("aria-selected", j === i ? "true" : "false"));
    active = i;
    if (i >= 0) { input.setAttribute("aria-activedescendant", "opt" + i); $("opt" + i).scrollIntoView({ block: "nearest" }); }
  }
  function pick(p) {
    chosen = p; input.value = p.name; close();
    proceed.disabled = false; msg.textContent = ""; input.removeAttribute("aria-invalid");
  }

  input.addEventListener("input", () => {
    chosen = null; proceed.disabled = true; msg.textContent = "";
    const q = norm(input.value);
    if (q.length < 2) { close(); list.innerHTML = ""; return; }
    const words = q.split(" ");
    const matches = PASSENGERS.filter(p => { const n = norm(p.name); return words.every(w => n.includes(w)); });
    render(matches, q);
    const exact = matches.find(p => norm(p.name) === q);
    if (exact && matches.length === 1) { chosen = exact; proceed.disabled = false; }
  });
  input.addEventListener("keydown", e => {
    if (list.hidden || !options.length) { if (e.key === "Enter" && chosen) go(); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); setActive(Math.min(active + 1, options.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive(Math.max(active - 1, 0)); }
    else if (e.key === "Enter") { e.preventDefault(); if (active >= 0) pick(options[active]); else if (options.length === 1) pick(options[0]); }
    else if (e.key === "Escape") close();
  });
  input.addEventListener("blur", () => setTimeout(close, 120));
  proceed.addEventListener("click", go);

  function buildPoster(p) {
    const r = ROLES[p.role];
    const node = $("passTpl").content.firstElementChild.cloneNode(true);
    if (p.role === "maid-of-honour") node.classList.add("moh");
    const fields = { name: p.name, cls: r.cls, flight: r.flight, to: r.to, toName: r.toName, ask: r.ask, seat: r.seat, boarding: r.boarding,
      reply: "REPLY BY " + REPLY_BY, foot: "BFF TO " + r.to + " / " + r.flight };
    node.querySelectorAll("[data-f]").forEach(el => { el.textContent = fields[el.dataset.f]; });
    return node;
  }
  function fitText(node) {
    // Shrink long names and the question so they always fit on one line
    [[".pname", 46, 22], [".ask", 66, 40]].forEach(([sel, max, min]) => {
      const el = node.querySelector(sel); let size = max; el.style.fontSize = size + "px";
      const box = sel === ".pname" ? el.parentElement : el;
      while (size > min && el.scrollWidth > box.clientWidth + 1) { size -= 1; el.style.fontSize = size + "px"; }
    });
  }
  function scaleInto(viewport, poster) {
    const s = viewport.clientWidth / 1080; poster.style.transform = "scale(" + s + ")";
  }

  // ---------- Passport data page ----------
  function passportData(p) {
    const parts = p.name.trim().split(/\s+/);
    const surname = parts.length > 1 ? parts[parts.length - 1] : "";
    const given = parts.length > 1 ? parts.slice(0, -1).join(" ") : parts[0];
    const moh = p.role === "maid-of-honour";
    const idx = PASSENGERS.indexOf(p) + 1;
    const num = (moh ? "MOH " : "BRD ") + String(idx).padStart(4, "0");
    const clean = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[^A-Z]/g, "<");
    const l1 = ("P<FNI" + clean(surname) + "<<" + clean(given)).padEnd(44, "<").slice(0, 44);
    const l2 = (num.replace(" ", "") + "<0FNI2804011F2804290<<<<<<<<<<<<<<<04").padEnd(44, "<").slice(0, 44);
    return {
      num, surname: surname || "\u2014", given, role: moh ? "Maid of Honour" : "Bridesmaid", roleCaps: moh ? "MAID OF HONOUR" : "BRIDESMAID",
      stampText: (moh ? "FIRST CLASS" : "APPROVED") + " \u2726 BRIDAL PARTY \u2726 2028 \u2726",
      mrz: l1 + "\n" + l2, first: parts[0]
    };
  }
  function buildPassportPage(p) {
    const d = passportData(p);
    const node = $("dpTpl").content.firstElementChild.cloneNode(true);
    node.querySelectorAll("[data-d]").forEach(el => { if (el.dataset.d !== "welcome") el.textContent = d[el.dataset.d]; });
    const stampSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="240" height="240"><defs><path id="a" d="M 5 20 A 15 15 0 1 1 35 20 A 15 15 0 1 1 5 20"/></defs>'
      + '<circle cx="20" cy="20" r="18.5" fill="none" stroke="#5C7A5E" stroke-width=".7"/><circle cx="20" cy="20" r="11" fill="none" stroke="#5C7A5E" stroke-width=".45"/>'
      + '<text font-family="Courier New, monospace" font-weight="700" font-size="3.1" fill="#5C7A5E" letter-spacing=".35"><textPath href="#a">' + d.stampText + '</textPath></text>'
      + '<path transform="translate(20 20) rotate(-20) scale(.7)" d="M-10 1.5 L10 -3.5 L8.5 -6 L1 -3.5 L-5 -8.5 L-7 -8 L-3 -2 L-7.5 -0.5 L-9.5 -2 L-11 -1.5 Z" fill="#5C7A5E"/></svg>';
    node.querySelector("[data-stamp]").src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(stampSvg);
    const w = node.querySelector('[data-d="welcome"]');
    w.textContent = "Dear " + d.first + ", this passport is your ticket to every moment of our journey.";
    const sig = document.createElement("b"); sig.textContent = "Love, Funbi"; w.appendChild(sig);
    // shrink long names to fit
    node.querySelectorAll(".v.big").forEach(el => { el.style.whiteSpace = "nowrap"; });
    return node;
  }
  function fitPassport(node) {
    node.querySelectorAll(".v.big").forEach(el => {
      let size = 16; const box = node.querySelector(".data");
      while (size > 10 && el.scrollWidth > box.clientWidth) { size -= .5; el.style.fontSize = size + "px"; }
    });
  }
  function scalePassport() {
    const wrap = $("pageWrap"), dp = wrap.firstElementChild;
    if (dp) dp.style.transform = "scale(" + (wrap.clientWidth / 352) + ")";
  }

  async function go() {
    if (!chosen) return;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    $("checkin").hidden = true; $("printing").hidden = false;
    await (document.fonts ? document.fonts.ready : Promise.resolve());
    await new Promise(r => setTimeout(r, reduce ? 200 : 1700));
    currentPoster = chosen;
    const wrap = $("pageWrap"); wrap.innerHTML = "";
    const dp = buildPassportPage(chosen); wrap.appendChild(dp);
    const cover = $("coverBtn"); cover.hidden = false; cover.style.animation = ""; cover.getAnimations().forEach(a => a.cancel());
    $("tapHint").hidden = false; $("passArea").hidden = true;
    $("printing").hidden = true; $("result").hidden = false;
    fitPassport(dp); scalePassport();
    $("book").classList.remove("arrive"); void $("book").offsetWidth; $("book").classList.add("arrive");
    $("hello").textContent = "Welcome, " + first(chosen.name) + ". Your passport has been issued.";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  $("coverBtn").addEventListener("click", async () => {
    const cover = $("coverBtn"), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (cover.dataset.busy) return; cover.dataset.busy = "1";
    cover.style.animation = "none"; $("tapHint").hidden = true;
    if (!reduce) await cover.animate([{ transform: "rotateY(0deg)" }, { transform: "rotateY(-178deg)" }], { duration: 1100, easing: "cubic-bezier(.45,.05,.25,1)", fill: "forwards" }).finished;
    cover.hidden = true; delete cover.dataset.busy;
    const stamp = $("pageWrap").querySelector(".stamp");
    stamp.classList.add("on");
    if (!reduce) await stamp.animate([{ transform: "rotate(-14deg) scale(2.2)", opacity: 0 }, { transform: "rotate(-14deg) scale(.94)", opacity: .95, offset: .7 }, { transform: "rotate(-14deg) scale(1)", opacity: .92 }], { duration: 450, easing: "ease-in" }).finished;
    await new Promise(r => setTimeout(r, reduce ? 0 : 700));
    // Now the boarding pass slides out
    const vp = $("viewport"); vp.innerHTML = "";
    const poster = buildPoster(currentPoster); vp.appendChild(poster);
    $("passArea").hidden = false; fitText(poster); scaleInto(vp, poster);
    vp.classList.remove("arrive"); void vp.offsetWidth; vp.classList.add("arrive");
    $("hello").textContent = currentPoster.role === "maid-of-honour" ? "Welcome aboard, " + first(currentPoster.name) + ". You are flying first class." : "Welcome aboard, " + first(currentPoster.name) + ".";
    setTimeout(() => $("passArea").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }), 250);
  });

  const first = n => n.trim().split(/\s+/)[0];
  addEventListener("resize", () => { const p = $("viewport").firstElementChild; if (p) scaleInto($("viewport"), p); scalePassport(); });

  $("restart").addEventListener("click", () => {
    $("result").hidden = true; $("passArea").hidden = true; $("checkin").hidden = false; input.value = ""; chosen = null; proceed.disabled = true; input.focus();
  });

  // Save the pass at full size
  async function capture() {
    if (!window.html2canvas) throw new Error("capture unavailable");
    const host = document.createElement("div"); host.className = "capture-host";
    const poster = buildPoster(currentPoster); host.appendChild(poster); document.body.appendChild(host);
    fitText(poster);
    try { return await html2canvas(poster, { scale: 2, backgroundColor: null, useCORS: true, logging: false, width: 1080, height: 1350, windowWidth: 1080 }); }
    finally { host.remove(); }
  }
  async function capturePassport() {
    const host = document.createElement("div"); host.className = "capture-host";
    const dp = buildPassportPage(currentPoster); dp.querySelector(".stamp").classList.add("on");
    host.appendChild(dp); document.body.appendChild(host); fitPassport(dp);
    try { return await html2canvas(dp, { scale: 3, backgroundColor: "#F7F2E7", logging: false, width: 352, height: 500, windowWidth: 352 }); }
    finally { host.remove(); }
  }
  const fileBase = () => "Boarding-Pass-" + currentPoster.name.replace(/[^\w]+/g, "-").replace(/^-|-$/g, "");
  async function withBusy(btn, fn) {
    const label = btn.textContent; btn.disabled = true; btn.textContent = "PREPARING";
    try { await fn(); } catch (e) { alert("Sorry, the download did not work on this device. Please take a screenshot of your pass instead."); }
    finally { btn.disabled = false; btn.textContent = label; }
  }
  function save(blobOrUrl, name) {
    const a = document.createElement("a"); a.download = name;
    a.href = typeof blobOrUrl === "string" ? blobOrUrl : URL.createObjectURL(blobOrUrl);
    document.body.appendChild(a); a.click(); a.remove();
  }
  $("dlPng").addEventListener("click", e => withBusy(e.currentTarget, async () => {
    const canvas = await capture();
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    save(blob, fileBase() + ".png");
  }));
  $("dlPdf").addEventListener("click", e => withBusy(e.currentTarget, async () => {
    const canvas = await capture();
    const pdf = new window.jspdf.jsPDF({ orientation: "portrait", unit: "px", format: [1080, 1350], hotfixes: ["px_scaling"] });
    pdf.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, 1080, 1350);
    const pp = await capturePassport();
    pdf.addPage([1056, 1500], "portrait");
    pdf.addImage(pp.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, 1056, 1500);
    pdf.save(fileBase() + ".pdf");
  }));
})();
</script>
</body>
